plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

version = "1.0.0"
group = "com.snakex.client"

base {
    archivesName = "snakex"
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" } // For ModMenu
    maven { url "https://api.modrinth.com/maven" } // For Sodium, Lithium, Iris
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.4"
    mappings "net.fabricmc:yarn:1.21.4+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.9"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.110.0+1.21.4"

    // Performance Dependencies
    modImplementation "maven.modrinth:sodium:mc1.21.4-0.6.13-fabric"
    modImplementation "maven.modrinth:lithium:mc1.21.4-0.15.3-fabric"
    modImplementation "maven.modrinth:iris:1.8.8+1.21.4-fabric"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}
